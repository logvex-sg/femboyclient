name: Gated release

# Produces a release only from a tag, and only after the same validation gate a PR passes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml', 'build-system/versions.json') }}

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Verify every guard, test and build
        run: ./gradlew --console=plain verifyAll

      - name: Assemble the client for the primary version
        run: ./gradlew --console=plain buildAll

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp build/dist/*/*.jar release-assets/
          cp build/dist/*/build-metadata.json release-assets/ || true
          (cd release-assets && sha256sum *.jar > SHA256SUMS)

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
